services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-durus}
      POSTGRES_USER: ${POSTGRES_USER:-durus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-durus} -d ${POSTGRES_DB:-durus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"
    volumes:
      - telegram_sessions:/app/sessions
    networks:
      - internal
      - proxy
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 --workers 3"
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.durus-api.rule=Host(`${API_DOMAIN:-api.durus.example.com}`)
      - traefik.http.routers.durus-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.durus-api.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.durus-api.loadbalancer.server.port=8000

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"
    volumes:
      - telegram_sessions:/app/sessions
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py download_pending_media
             --batch-size ${WORKER_BATCH_SIZE:-2}
             --interval ${WORKER_INTERVAL_SECONDS:-900}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL is required}
    restart: unless-stopped
    networks:
      - proxy
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.durus-web.rule=Host(`${FRONTEND_DOMAIN:-durus.example.com}`)
      - traefik.http.routers.durus-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.durus-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.durus-web.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
  telegram_sessions:
